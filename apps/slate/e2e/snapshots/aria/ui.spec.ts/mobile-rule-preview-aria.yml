  - paragraph: Core Rules v2 · p. 15
  - paragraph:
    - text: A combat encounter begins when the GM tells the party to “Roll Initiative!” Each hero rolls
    - button "1d20"
    - text: and adds their Initiative bonus (typically their DEX). A single digit means they start combat with 1 action. 2 digits, they start combat with 2. A result of 20+ (or a natural 20) means they get all 3 actions!
  - paragraph:
    - emphasis: Regardless of what a hero rolls on Initiative, at the end of their turn they gain all 3 actions back.
